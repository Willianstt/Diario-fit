// ---------- gráfico de medida com linha de objetivo ----------
function MeasureChart({ points, goal, unit }) {
  if (!points || points.length === 0) return null;
  const W = 340, H = 220, padL = 30, padR = 14, padT = 14, padB = 24;
  const values = points.map((p) => p.value);
  const all = goal != null ? [...values, goal] : values;
  let lo = Math.min(...all), hi = Math.max(...all);
  const span = Math.max(1, hi - lo);
  lo = Math.floor(lo - span * 0.08); hi = Math.ceil(hi + span * 0.08);
  const rawStep = (hi - lo) / 4;
  const step = rawStep <= 1 ? 1 : rawStep <= 2 ? 2 : rawStep <= 5 ? 5 : Math.ceil(rawStep / 5) * 5;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xOf = (i) => padL + (points.length > 1 ? (i / (points.length - 1)) * innerW : innerW / 2);
  const yOf = (v) => padT + innerH - ((v - lo) / (hi - lo || 1)) * innerH;
  const line = points.map((p, i) => `${i ? "L" : "M"}${xOf(i).toFixed(1)},${yOf(p.value).toFixed(1)}`).join(" ");
  const area = `${line} L${xOf(points.length - 1).toFixed(1)},${padT + innerH} L${xOf(0).toFixed(1)},${padT + innerH} Z`;
  const labelIdx = points.length <= 5 ? points.map((_, i) => i) : [0, 1, 2, 3, 4].map((k) => Math.round((k / 4) * (points.length - 1)));
  const gid = "g" + Math.random().toString(36).slice(2, 7);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}>
      <defs>
        <linearGradient id={gid} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.16" />
          <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.02" />
        </linearGradient>
      </defs>
      {ticks.map((t) => (
        <g key={t}>
          <line x1={padL} x2={W - padR} y1={yOf(t)} y2={yOf(t)} stroke="#3F3F46" strokeDasharray="4 4" strokeWidth="0.8" />
          <text x={padL - 6} y={yOf(t) + 3} fontSize="9" fill="#71717A" textAnchor="end" fontFamily="JetBrains Mono, monospace">{t}</text>
        </g>
      ))}
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke="#F4F1E8" strokeWidth="2" strokeLinejoin="round" />
      {points.length <= 40 && points.map((p, i) => <circle key={i} cx={xOf(i)} cy={yOf(p.value)} r="2.8" fill="#F4F1E8" />)}
      {goal != null && (
        <g>
          <line x1={padL} x2={W - padR} y1={yOf(goal)} y2={yOf(goal)} stroke="#22C55E" strokeDasharray="5 4" strokeWidth="1.2" />
          <text x={W - padR} y={yOf(goal) - 5} fontSize="9" fill="#22C55E" textAnchor="end" fontFamily="JetBrains Mono, monospace" letterSpacing="1">OBJETIVO {fmtNum(goal)}{unit}</text>
        </g>
      )}
      {labelIdx.map((i) => (
        <text key={i} x={xOf(i)} y={H - 6} fontSize="9" fill="#71717A" textAnchor={i === 0 ? "start" : i === points.length - 1 ? "end" : "middle"} fontFamily="JetBrains Mono, monospace">{fmtDM(points[i].date)}</text>
      ))}
    </svg>
  );
}

// ---------- MEDIDAS ----------
const MEASURES = [
  { key: "weight", label: "Peso", unit: "kg", goalKey: "weightGoal" },
  { key: "bodyFat", label: "Gordura Corporal", unit: "%", goalKey: "bodyFatGoal" },
  { key: "waist", label: "Cintura", unit: "cm", goalKey: "waistGoal" },
];

function measureSeries(evolutionLog, key) {
  return Object.entries(evolutionLog)
    .filter(([, v]) => v && v[key] != null && v[key] !== "" && !isNaN(v[key]))
    .map(([date, v]) => ({ date, value: Number(v[key]) }))
    .sort((a, b) => a.date.localeCompare(b.date));
}

function measureStats(series, goal) {
  if (series.length === 0) return null;
  const first = series[0], last = series[series.length - 1];
  const delta = Math.round((last.value - first.value) * 10) / 10;
  let progress = null, achieved = null, needed = null;
  const g = goal === "" || goal == null ? null : toNum(goal);
  if (g != null && g !== first.value) {
    needed = Math.round(Math.abs(first.value - g) * 10) / 10;
    achieved = Math.round(((first.value - last.value) * Math.sign(first.value - g)) * 10) / 10;
    progress = clamp(achieved / needed, 0, 1);
  }
  return { first, last, delta, goal: g, progress, achieved, needed, span: spanLabel(first.date, last.date) };
}

  if (view !== "home") {
    const m = MEASURES.find((x) => x.key === view);
    const series = measureSeries(evolutionLog, m.key);
    const st = measureStats(series, profile[m.goalKey]);
    return (
      <div className="pt-5">
        <button onClick={() => setView("home")} className="flex items-center gap-1 text-[13px] text-zinc-400 mb-3"><ChevronLeft size={15} /> Medidas</button>

        </div>
        {showForm && (m.key === "bodyFat"

        ) : (
          <>

                {st.goal != null ? (

                  </p>
                ) : (
                  <p className="font-mono text-2xl font-semibold tabular-nums">{st.delta < 0 ? "↓" : st.delta > 0 ? "↑" : "→"} {fmtNum(Math.abs(st.delta))}<span className="text-[15px] text-zinc-400"> {m.unit}</span></p>
                )}

              <div className="mt-3 px-1">

                <p className="font-mono text-[11px] text-zinc-500 mt-1.5">{Math.round((st.progress || 0) * 100)}% do caminho até {fmtNum(st.goal)} {m.unit}</p>
              </div>
            )}

              <MeasureChart points={series} goal={st.goal} unit={m.unit} />
            </div>

        return (

                    <p className="font-mono text-[34px] leading-none font-semibold tabular-nums">{fmtNum(st.last.value)}<span className="text-[14px] text-zinc-400"> {m.unit}</span></p>

                  </div>
                  {series.length > 1 && (
                    <div className="text-right">
                      <p className="font-mono text-[16px] font-semibold">{st.delta < 0 ? "↓" : st.delta > 0 ? "↑" : "→"} {fmtNum(Math.abs(st.delta))} {m.unit}</p>
                      <p className="text-[12px] text-zinc-500">{st.span}</p>
                    </div>
                  )}
                </div>
                {st.goal != null && (
                  <div className="mt-3">
                    <div className="h-[5px] rounded-full bg-zinc-800 overflow-hidden"><div className="h-full rounded-full bg-green-500" style={{ width: `${(st.progress || 0) * 100}%` }} /></div>
                    <p className="font-mono text-[11px] text-zinc-500 mt-1.5">meta {fmtNum(st.goal)} {m.unit} · {Math.round((st.progress || 0) * 100)}% do caminho</p>
                  </div>
                )}
              </>
            ) : (
              <p className="mt-2 font-mono text-[12px] text-zinc-500">sem registros</p>
            )}

      })}

      {showForm && <MeasureEntryModal evolutionLog={evolutionLog} heightCm={profile.heightCm} onSave={(d, e) => { onSaveEntry(d, e); setShowForm(false); }} onClose={() => setShowForm(false)} />}
      {showGoals && <MeasureGoalsModal profile={profile} onSave={(g) => { onSaveGoals(g); setShowGoals(false); }} onClose={() => setShowGoals(false)} />}
    </div>
  );
}

// formulário de medidas reaproveitado em Medidas e no Check-in
function useMeasureForm(entry, heightCm) {
  const init = (k) => (entry && entry[k] != null ? String(entry[k]).replace(".", ",") : "");
  const [weight, setWeight] = useState(init("weight"));
  const [neck, setNeck] = useState(init("neck"));
  const [waist, setWaist] = useState(init("waist"));
  const [bfManual, setBfManual] = useState(entry && entry.bodyFat != null && !navyBodyFat({ neck: entry.neck, waist: entry.waist, heightCm }) ? String(entry.bodyFat).replace(".", ",") : "");
  const bfAuto = navyBodyFat({ neck, waist, heightCm });
  const bodyFat = bfManual !== "" ? toNum(bfManual) || null : bfAuto;
  const reset = (e) => {
    const g = (k) => (e && e[k] != null ? String(e[k]).replace(".", ",") : "");
    setWeight(g("weight")); setNeck(g("neck")); setWaist(g("waist"));
    setBfManual(e && e.bodyFat != null && !navyBodyFat({ neck: e.neck, waist: e.waist, heightCm }) ? String(e.bodyFat).replace(".", ",") : "");
  };
  const values = () => ({ weight: toNum(weight) || null, neck: toNum(neck) || null, waist: toNum(waist) || null, bodyFat: bodyFat || null });
  const fields = (
    <div className="flex flex-col gap-3">
      <div className="grid grid-cols-3 gap-2">
        <Field label="Peso (kg)" value={weight} onChange={(e) => setWeight(e.target.value)} type="number" />
        <Field label="Pescoço (cm)" value={neck} onChange={(e) => setNeck(e.target.value)} type="number" />
        <Field label="Cintura (cm)" value={waist} onChange={(e) => setWaist(e.target.value)} type="number" />
      </div>
      <div className="flex items-center justify-between bg-black border border-zinc-800 rounded-lg px-3 py-2">
        <span className="font-mono text-[11px] text-zinc-500 uppercase tracking-wider">% gordura {bfManual !== "" ? "(manual)" : "(marinha EUA)"}</span>
        <span className="font-mono text-[15px] font-semibold text-green-500">{bodyFat ? `${fmtNum(bodyFat)}%` : "–"}</span>
      </div>
      <Field label="% gordura manual (bioimpedância, opcional)" value={bfManual} onChange={(e) => setBfManual(e.target.value)} type="number" placeholder="deixe vazio para calcular" />
    </div>
  );
  return { fields, values, reset };
}

// lançamento rápido de uma medida só (peso ou cintura), em qualquer dia
function QuickMeasureModal({ measure, evolutionLog, heightCm, onSave, onClose }) {
  const [d, setD] = useState(todayStr());
  const cur = (day) => (evolutionLog[day] && evolutionLog[day][measure.key] != null ? String(evolutionLog[day][measure.key]).replace(".", ",") : "");
  const [val, setVal] = useState(cur(todayStr()));
  useEffect(() => { setVal(cur(d)); }, [d]);
  const save = () => {
    const v = toNum(val);
    if (!v) return;
    const entry = { [measure.key]: v };
    // se mudou a cintura e o dia tem pescoço, recalcula o % de gordura
    if (measure.key === "waist") {
      const neck = evolutionLog[d]?.neck;
      const bf = navyBodyFat({ neck, waist: v, heightCm });
      if (bf) entry.bodyFat = bf;
    }
    onSave(d, entry);
  };
  return (
    <Modal title={`Adicionar ${measure.label.toLowerCase()}`} onClose={onClose}>
      <div className="flex flex-col gap-3">
        <label className="flex flex-col gap-1">
          <span className="text-[11px] font-mono uppercase tracking-wider text-zinc-500">Data</span>
          <input type="date" value={d} max={todayStr()} onChange={(e) => e.target.value && setD(e.target.value)} className="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-[14px] focus:outline-none focus:border-green-500 text-white" style={{ colorScheme: "dark" }} />
        </label>
        <label className="flex flex-col gap-1">
          <span className="text-[11px] font-mono uppercase tracking-wider text-zinc-500">{measure.label} ({measure.unit})</span>
          <input autoFocus type="text" inputMode="decimal" value={val} onChange={(e) => setVal(e.target.value)} onKeyDown={(e) => e.key === "Enter" && save()} placeholder="0,0" className="bg-black border border-zinc-700 rounded-xl px-4 py-4 font-mono text-3xl text-center focus:outline-none focus:border-green-500" />
        </label>
        {cur(d) && <p className="font-mono text-[11px] text-zinc-500 text-center">já existe um valor nesse dia — salvar substitui</p>}
        <button onClick={save} disabled={!toNum(val)} className="mt-1 bg-green-500 disabled:bg-zinc-800 disabled:text-zinc-500 text-black font-semibold rounded-xl py-3 text-[15px]">Salvar</button>
      </div>
    </Modal>
  );
}

function MeasureEntryModal({ evolutionLog, heightCm, onSave, onClose }) {
  const [d, setD] = useState(todayStr());
  const form = useMeasureForm(evolutionLog[todayStr()], heightCm);
  useEffect(() => { form.reset(evolutionLog[d]); }, [d]);
  return (
    <Modal title="Lançar medidas" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <label className="flex flex-col gap-1">
          <span className="text-[11px] font-mono uppercase tracking-wider text-zinc-500">Data</span>
          <input type="date" value={d} max={todayStr()} onChange={(e) => e.target.value && setD(e.target.value)} className="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-[14px] focus:outline-none focus:border-green-500 text-white" style={{ colorScheme: "dark" }} />
        </label>
        {form.fields}
        <button onClick={() => onSave(d, form.values())} className="mt-1 bg-green-500 text-black font-semibold rounded-xl py-3 text-[15px]">Salvar</button>
      </div>
    </Modal>
  );
}

function MeasureGoalsModal({ profile, onSave, onClose }) {
  const g = (k) => (profile[k] != null && profile[k] !== "" ? String(profile[k]).replace(".", ",") : "");
  const [w, setW] = useState(g("weightGoal"));
  const [bf, setBf] = useState(g("bodyFatGoal"));
  const [wa, setWa] = useState(g("waistGoal"));
  const val = (s) => (s === "" ? "" : toNum(s) || "");
  return (
    <Modal title="Metas de medidas" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <Field label="Peso (kg)" value={w} onChange={(e) => setW(e.target.value)} type="number" placeholder="ex: 68" />
        <Field label="Gordura corporal (%)" value={bf} onChange={(e) => setBf(e.target.value)} type="number" placeholder="ex: 10" />
        <Field label="Cintura (cm)" value={wa} onChange={(e) => setWa(e.target.value)} type="number" placeholder="ex: 72" />
        <p className="font-mono text-[11px] text-zinc-500">deixe vazio a meta que não quiser acompanhar</p>
        <button onClick={() => onSave({ weightGoal: val(w), bodyFatGoal: val(bf), waistGoal: val(wa) })} className="mt-1 bg-green-500 text-black font-semibold rounded-xl py-3 text-[15px]">Salvar metas</button>
      </div>
    </Modal>
  );
}

function WeekDots({ dots }) {
  const color = { ok: "#22C55E", partial: "#71717A", miss: "#27272A", future: "transparent" };
  if (dots.length > 31) {
    return (
      <div className="mt-4 flex gap-[1px] h-4 rounded overflow-hidden">
        {dots.map((s, i) => <div key={i} className="flex-1" style={{ background: s === "future" ? "#18181B" : color[s] }} />)}
      </div>
    );
  }
  if (dots.length !== 7) {
    return (
      <div className="mt-4 flex flex-wrap gap-1.5">
        {dots.map((s, i) => <div key={i} className="w-[14px] h-[14px] rounded-full" style={{ background: color[s], border: s === "future" ? "1.5px dashed #3F3F46" : "none" }} />)}
      </div>
    );
  }
  return (
    <div className="flex gap-2.5 mt-4">
      {dots.map((s, i) => (
        <div key={i} className="flex flex-col items-center gap-1">
          <div className="w-[18px] h-[18px] rounded-full" style={{ background: color[s], border: s === "future" ? "1.5px dashed #3F3F46" : "none" }} />
          <span className="font-mono text-[9px] text-zinc-600">{"STQQSSD"[i]}</span>
        </div>
      ))}
    </div>
  );
}

}

const TREND_PERIODS = [
  { id: "week", label: "Semana", short: "Semanal", days: 7 },
  { id: "15d", label: "15 dias", short: "15 dias", days: 15 },
  { id: "1m", label: "1 mês", short: "Mensal", days: 30 },
  { id: "3m", label: "3 meses", short: "Trimestral", days: 90 },
  { id: "6m", label: "6 meses", short: "Semestral", days: 180 },
];

function MetricasTab({ foodLog, trainingLog, waterLog, activityLog, profile, macroGoals, evolutionLog, onImportAppleHealth, profileName }) {
  const [period, setPeriod] = useState("week");
  const [anchor, setAnchor] = useState(todayStr()); // último dia do período
  const pdef = TREND_PERIODS.find((p) => p.id === period);
  const dates = period === "week"
    ? weekDates(anchor)
    : Array.from({ length: pdef.days }, (_, i) => addDays(anchor, i - pdef.days + 1));
  const isCurrent = dates.includes(todayStr());
  const shift = (dir) => {
    if (period === "week") setAnchor(addDays(dates[0], dir * 7));
    else {
      const next = addDays(anchor, dir * pdef.days);
      setAnchor(next > todayStr() ? todayStr() : next);
    }
  };
  const choosePeriod = (id) => { setPeriod(id); setAnchor(todayStr()); };
  const m = computeWeekMetrics({ dates, foodLog, trainingLog, waterLog, activityLog, profile, macroGoals, evolutionLog });

  const healthFileRef = useRef(null);
  const [importStatus, setImportStatus] = useState(null);
  const [importProgress, setImportProgress] = useState(0);
  const handleHealthImport = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".xml")) { setImportStatus("error"); return; }
    setImportStatus("loading"); setImportProgress(0);
    try {
      const result = await onImportAppleHealth(file, (read, total) => total && setImportProgress(Math.round((read / total) * 100)));
      setImportStatus(result.recordCount ? result : "empty");
    } catch (err) { console.error(err); setImportStatus("error"); }
  };

  const d0 = new Date(dates[0] + "T00:00:00"), d6 = new Date(dates[dates.length - 1] + "T00:00:00");
  const rangeLabel = `${d0.getDate()} ${MONTHS_PT[d0.getMonth()]}.${d0.getFullYear() !== d6.getFullYear() ? ` ${d0.getFullYear()}` : ""} – ${d6.getDate()} ${MONTHS_PT[d6.getMonth()]}. ${d6.getFullYear()}`;

  const exportReport = () => {
    const w = window.open("", "_blank");
    if (!w) return;
    const row = (label, val) => `<div class="card"><div class="label">${label}</div><div class="val">${val}</div></div>`;
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Relatório — ${pdef.label}</title>
      <style>body{font-family:-apple-system,Arial,sans-serif;padding:32px;color:#111;max-width:640px;margin:0 auto}h1{font-size:22px;margin-bottom:0}.sub{color:#666;font-size:13px;margin:2px 0 24px}.card{border:1px solid #ddd;border-radius:10px;padding:14px 16px;margin-bottom:10px}.label{font-size:11px;text-transform:uppercase;color:#888;letter-spacing:.05em}.val{font-size:20px;font-weight:600;margin-top:2px}</style></head><body>
      <h1>Relatório ${pdef.short.toLowerCase()} — ${profileName || ""}</h1><p class="sub">${rangeLabel} · comprometimento geral ${m.overall}%</p>
      ${row("Treinos", `${m.rotina.done}/${m.rotina.goal} · ${m.rotina.pct}%`)}
      ${m.deficit.days.length ? row("Déficit calórico acumulado", `${m.deficit.total.toLocaleString("pt-BR")} kcal ≈ ${m.deficit.kg.toLocaleString("pt-BR", { maximumFractionDigits: 2 })} kg de gordura (${m.deficit.days.length} dias)`) : ""}
      ${row("Nutrição — média diária", `${m.nutricao.avgKcal ?? "–"} / ${m.nutricao.goal} kcal · ${m.nutricao.pct}%`)}
      ${row("Macros — média diária", `P ${m.nutricao.protein ?? "–"}g · G ${m.nutricao.fat ?? "–"}g · C ${m.nutricao.carbs ?? "–"}g`)}
      ${row("Água — média diária", `${m.agua.avg ?? "–"} / ${m.agua.goal} ml · ${m.agua.pct}%`)}
      ${m.passos ? row("Passos — média diária", `${m.passos.avg.toLocaleString("pt-BR")}${m.passos.goal ? ` / ${m.passos.goal.toLocaleString("pt-BR")}` : ""}`) : ""}
      ${m.recuperacao?.sleepH ? row("Sono — média", `${String(m.recuperacao.sleepH).replace(".", ",")} h`) : ""}
      <p class="sub">Gerado em ${new Date().toLocaleDateString("pt-BR")}</p></body></html>`);
    w.document.close();
    setTimeout(() => w.print(), 300);
  };

  const overallLvl = commitmentLevel(m.overall);

  return (
    <div className="pt-5 flex flex-col gap-3">
      <div className="flex items-center justify-between">
        <button onClick={() => shift(-1)} className="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center active:bg-zinc-800" aria-label="Período anterior"><ChevronLeft size={18} /></button>
        <div className="text-center">
          <p className="font-display text-2xl font-bold leading-none">Tendências</p>
          <p className="text-[13px] text-zinc-500 mt-1">{pdef.short} · {rangeLabel}</p>
        </div>
        <button onClick={() => !isCurrent && shift(1)} disabled={isCurrent} className="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center active:bg-zinc-800 disabled:opacity-30" aria-label="Próximo período"><ChevronRight size={18} /></button>
      </div>

      <div className="flex gap-1 bg-zinc-900 border border-zinc-800 rounded-2xl p-1">
        {TREND_PERIODS.map((p) => (
          <button key={p.id} onClick={() => choosePeriod(p.id)} className={`flex-1 py-2 rounded-xl text-[12px] font-medium whitespace-nowrap transition ${period === p.id ? "bg-[#F4F1E8] text-black" : "text-zinc-400 active:text-white"}`}>{p.label}</button>
        ))}
      </div>

      <div className="bg-zinc-900 border border-zinc-800 rounded-3xl px-5 py-4 flex items-center justify-between">
        <div>
          <p className="text-[13px] text-zinc-500">Comprometimento geral</p>
          <p className="font-mono text-[34px] leading-none font-semibold mt-1">{m.overall}<span className="text-[15px] text-zinc-400"> %</span></p>
        </div>
        <span className="font-mono text-[12px] font-semibold tracking-wider px-3 py-1.5 rounded-full bg-black" style={{ color: overallLvl.color }}>{overallLvl.label}</span>
      </div>

      <DeficitCard deficit={m.deficit} dates={dates} />

      <MetricCard
        title="Treinos"
        pct={m.rotina.pct}
        main={m.rotina.done}
        mainSuffix={` / ${m.rotina.goal}`}
        mainLabel={period === "week" ? "Concluídos na semana" : "Concluídos no período"}
        successDays={m.rotina.done}
        streak={m.rotina.streak}
        dots={m.rotina.dots}
        footer={[
          ...(m.rotina.avgMinutes != null ? [{ label: "Duração", value: m.rotina.avgMinutes, suffix: " min/dia" }] : []),
          ...(m.atividade?.activeKcal != null ? [{ label: "Energia ativa", value: m.atividade.activeKcal, suffix: " kcal/dia" }] : []),
        ]}
      />

      <MetricCard
        title="Nutrição"
        pct={m.nutricao.pct}
        main={m.nutricao.avgKcal != null ? m.nutricao.avgKcal.toLocaleString("pt-BR") : "–"}
        mainSuffix={` / ${m.nutricao.goal.toLocaleString("pt-BR")}`}
        mainLabel="Média diária (kcal)"
        successDays={m.nutricao.successDays}
        streak={m.nutricao.streak}
        dots={m.nutricao.dots}
        footer={[
          { label: "Proteína", value: m.nutricao.protein ?? "–", suffix: `/${Math.round(macroGoals.protein)}g` },
          { label: "Gordura", value: m.nutricao.fat ?? "–", suffix: `/${Math.round(macroGoals.fat)}g` },
          { label: "Carbo", value: m.nutricao.carbs ?? "–", suffix: `/${Math.round(macroGoals.carbs)}g` },
        ]}
      />

      <MetricCard
        title="Água"
        pct={m.agua.goal ? m.agua.pct : null}
        main={m.agua.avg != null ? m.agua.avg.toLocaleString("pt-BR") : "–"}
        mainSuffix={m.agua.goal ? ` / ${m.agua.goal.toLocaleString("pt-BR")}` : ""}
        mainLabel="Média diária (ml)"
        successDays={m.agua.successDays}
        streak={m.agua.streak}
        dots={m.agua.dots}
      />

      {m.passos && (
        <MetricCard
          title="Passos"
          pct={m.passos.pct}
          main={m.passos.avg.toLocaleString("pt-BR")}
          mainSuffix={m.passos.goal ? ` / ${(m.passos.goal / 1000).toLocaleString("pt-BR")}K` : ""}
          mainLabel="Média diária"
          successDays={m.passos.goal ? m.passos.successDays : null}
          streak={m.passos.goal ? m.passos.streak : null}
          dots={m.passos.goal ? m.passos.dots : null}
          footer={[
            ...(m.atividade?.distanceKm != null ? [{ label: "Distância", value: fmtNum(m.atividade.distanceKm), suffix: " km/dia" }] : []),
            ...(m.atividade?.exerciseMin != null ? [{ label: "Exercício", value: m.atividade.exerciseMin, suffix: " min/dia" }] : []),
          ]}
        />
      )}

      {m.recuperacao && (
        <MetricCard
          title="Recuperação"
          main={m.recuperacao.sleepH != null ? fmtNum(m.recuperacao.sleepH) : "–"}
          mainSuffix=" h"
          mainLabel="Sono médio por noite"
          footer={m.recuperacao.restingHr != null ? [{ label: "FC de repouso", value: m.recuperacao.restingHr, suffix: " bpm" }] : []}
        />
      )}

      <div className="mt-2 grid grid-cols-2 gap-2">
        <input ref={healthFileRef} type="file" accept=".xml,text/xml,application/xml" onChange={handleHealthImport} className="hidden" />
        <button onClick={() => healthFileRef.current?.click()} className="bg-zinc-900 border border-zinc-800 rounded-2xl py-3 text-[13px] text-zinc-300 active:bg-zinc-800">Importar Apple Health</button>
        <button onClick={exportReport} className="bg-zinc-900 border border-zinc-800 rounded-2xl py-3 text-[13px] text-zinc-300 active:bg-zinc-800">Exportar relatório</button>
      </div>
      {importStatus === "loading" && <p className="font-mono text-[12px] text-zinc-500">processando export.xml… {importProgress > 0 ? `${importProgress}%` : ""}</p>}
      {importStatus === "error" && <p className="font-mono text-[12px] bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2">arquivo inválido — descompacte o .zip do app Saúde e selecione o export.xml de dentro dele</p>}
      {importStatus === "empty" && <p className="font-mono text-[12px] bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2">nenhum registro reconhecível — confirme que é o export.xml (não o export_cda.xml)</p>}
      {importStatus && typeof importStatus === "object" && (
        <p className="font-mono text-[12px] text-green-500 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2">
          importado: {importStatus.activityDays} dias de atividade · {importStatus.workoutsAdded} treinos · {importStatus.weightAdded} pesos{importStatus.bodyFatAdded ? ` · ${importStatus.bodyFatAdded} % gordura` : ""} ({importStatus.recordCount.toLocaleString("pt-BR")} registros lidos)
        </p>
      )}
    </div>
  );
}

// ---------- CHECK-IN ----------
const POSES = [{ id: "front", label: "Frente" }, { id: "side", label: "Lado" }, { id: "back", label: "Costas" }];

function checkinWindow(today, checkins) {
  const dates = weekDates(today);
  const sat = dates[5], sun = dates[6];
  const dow = new Date(today + "T00:00:00").getDay();
  const isWeekend = dow === 6 || dow === 0;
  const done = checkins[sat] ? sat : checkins[sun] ? sun : null;
  return { isWeekend, done, nextSat: sat };
}

function PhotoSlot({ label, src, onPick }) {
  const ref = useRef(null);
  return (
    <div className="flex flex-col items-center gap-1.5">
      <input ref={ref} type="file" accept="image/*" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; e.target.value = ""; if (f) onPick(f); }} />
      <button onClick={() => ref.current?.click()} className="w-full aspect-[3/4] rounded-2xl overflow-hidden bg-black border border-dashed border-zinc-700 flex items-center justify-center active:border-green-500">
        {src ? <img src={src} alt={label} className="w-full h-full object-cover" /> : <Camera size={24} className="text-zinc-500" />}
      </button>
      <span className="text-[13px] font-medium">{label}</span>
    </div>
  );
}

function CheckinForm({ date, existing, existingPhotos, evolutionEntry, heightCm, onSave, onCancel }) {
  const [photos, setPhotos] = useState(existingPhotos || {});
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const form = useMeasureForm(evolutionEntry, heightCm);
  const pick = async (pose, file) => {
    try { const url = await compressImage(file, 720, 0.72); setPhotos((p) => ({ ...p, [pose]: url })); }
    catch (e) { setError("não consegui ler essa foto"); }
  };
  const nPhotos = POSES.filter((p) => photos[p.id]).length;
  const save = async () => {
    setSaving(true); setError(null);
    const res = await onSave(date, photos, form.values());
    setSaving(false);
    if (res && !res.ok) setError(res.message || "erro ao salvar — verifique a conexão com o Supabase");
  };
  return (
    <div className="pt-5">
      <button onClick={onCancel} className="flex items-center gap-1 text-[13px] text-zinc-400 mb-3"><ChevronLeft size={15} /> Check-ins</button>
      <h2 className="font-display text-3xl font-bold tracking-tight">{existing ? "Editar check-in" : "Novo check-in"}</h2>
      <p className="text-[13px] text-zinc-500 mt-0.5">{fmtWeekdayLong(date)}</p>

      <p className="mt-5 text-[17px] font-semibold">Fotos</p>
      <p className="text-[12px] text-zinc-500 mb-3">mesmo lugar, mesma luz e mesma pose toda semana</p>
      <div className="grid grid-cols-3 gap-2.5">
        {POSES.map((p) => <PhotoSlot key={p.id} label={p.label} src={photos[p.id]} onPick={(f) => pick(p.id, f)} />)}
      </div>

      <p className="mt-6 text-[17px] font-semibold mb-3">Medidas</p>
      {form.fields}

      {error && <p className="mt-3 font-mono text-[12px] bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2">{error}</p>}
      <button onClick={save} disabled={saving || nPhotos === 0} className="mt-5 w-full bg-green-500 disabled:bg-zinc-800 disabled:text-zinc-500 text-black font-semibold rounded-2xl py-4 text-[16px]">
        {saving ? "salvando…" : nPhotos === 0 ? "adicione pelo menos uma foto" : "Salvar check-in"}
      </button>
    </div>
  );
}

function CheckinTab({ checkins, evolutionLog, heightCm, loadPhotos, onSave, onDelete }) {
  const today = todayStr();
  const [view, setView] = useState({ name: "list" }); // list | detail | form
  const [photoCache, setPhotoCache] = useState({});
  const [compareA, setCompareA] = useState("");
  const [compareB, setCompareB] = useState("");
  const [comparePose, setComparePose] = useState("front");

  // check-ins novos + fotos antigas (lançadas pela tela de evolução)
  const legacyDates = Object.entries(evolutionLog).filter(([d, v]) => v && v.photo && !checkins[d]).map(([d]) => d);
  const allDates = [...Object.keys(checkins), ...legacyDates].sort().reverse();

  useEffect(() => {
    let alive = true;
    const missing = Object.keys(checkins).filter((d) => !photoCache[d]);
    if (missing.length === 0) return;
    Promise.all(missing.map(async (d) => [d, (await loadPhotos(d)) || {}])).then((pairs) => {
      if (alive) setPhotoCache((c) => ({ ...c, ...Object.fromEntries(pairs) }));
    });
    return () => { alive = false; };
  }, [checkins]);

  const photosOf = (d) => (checkins[d] ? photoCache[d] || {} : { front: evolutionLog[d]?.photo });
  const win = checkinWindow(today, checkins);

  useEffect(() => {
    if (!compareA && allDates.length > 1) { setCompareA(allDates[allDates.length - 1]); setCompareB(allDates[0]); }
  }, [allDates.length]);

  if (view.name === "form") {
    return (
      <CheckinForm
        date={view.date}
        existing={!!checkins[view.date]}
        existingPhotos={photoCache[view.date]}
        evolutionEntry={evolutionLog[view.date]}
        heightCm={heightCm}
        onCancel={() => setView(checkins[view.date] ? { name: "detail", date: view.date } : { name: "list" })}
        onSave={async (d, photos, measures) => {
          const res = await onSave(d, photos, measures);
          if (res.ok) { setPhotoCache((c) => ({ ...c, [d]: photos })); setView({ name: "detail", date: d }); }
          return res;
        }}
      />
    );
  }

  if (view.name === "detail") {
    const d = view.date;
    const ph = photosOf(d);
    const ev = evolutionLog[d] || {};
    const isLegacy = !checkins[d];
    return (
      <div className="pt-5">
        <button onClick={() => setView({ name: "list" })} className="flex items-center gap-1 text-[13px] text-zinc-400 mb-3"><ChevronLeft size={15} /> Check-ins</button>
        <h2 className="font-display text-3xl font-bold tracking-tight">Detalhes do check-in</h2>
        <p className="text-[13px] text-zinc-500 mt-0.5">{fmtWeekdayLong(d)}</p>

        <p className="mt-5 text-[17px] font-semibold mb-3">Fotos</p>
        <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-4">
          <div className="flex gap-3 overflow-x-auto snap-x">
            {POSES.filter((p) => ph[p.id]).map((p) => (
              <div key={p.id} className="flex-shrink-0 w-[70%] sm:w-[45%] snap-start">
                <img src={ph[p.id]} alt={p.label} className="w-full aspect-[3/4] object-cover rounded-2xl" />
                <p className="text-center text-[14px] font-medium mt-2">{isLegacy ? "Foto" : p.label}</p>
              </div>
            ))}
            {POSES.every((p) => !ph[p.id]) && <p className="font-mono text-[12px] text-zinc-500 py-6">carregando fotos…</p>}
          </div>
        </div>

        <p className="mt-6 text-[17px] font-semibold mb-3">Medidas</p>
        <div className="bg-zinc-900 border border-zinc-800 rounded-3xl px-5">
          {MEASURES.map((m, i) => (
            <div key={m.key} className={`flex items-center justify-between py-4 ${i ? "border-t border-zinc-800" : ""}`}>
              <span className="text-[15px] text-zinc-400">{m.label}</span>
              <span className="font-mono text-[17px] font-semibold">{fmtNum(ev[m.key])}<span className="text-[13px] text-zinc-400 font-normal"> {m.unit}</span></span>
            </div>
          ))}
        </div>

        {!isLegacy && (
          <div className="mt-5 grid grid-cols-2 gap-2">
            <button onClick={() => setView({ name: "form", date: d })} className="bg-zinc-900 border border-zinc-800 rounded-2xl py-3 text-[14px] active:bg-zinc-800">Editar</button>
            <button onClick={async () => { if (confirm("Apagar este check-in? As medidas continuam salvas em Medidas.")) { await onDelete(d); setView({ name: "list" }); } }} className="bg-zinc-900 border border-zinc-800 rounded-2xl py-3 text-[14px] text-red-400 active:bg-zinc-800">Apagar</button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="pt-5 flex flex-col gap-4">
      {/* status da semana */}
      {win.done ? (
        <div className="bg-zinc-900 border border-zinc-800 rounded-3xl px-5 py-4 flex items-center gap-3">
          <div className="w-10 h-10 rounded-full bg-green-500 text-black flex items-center justify-center"><Check size={20} /></div>
          <div className="flex-1">
            <p className="text-[15px] font-semibold">Check-in da semana feito</p>
            <p className="text-[12px] text-zinc-500">{fmtWeekdayLong(win.done)} · próximo no sábado</p>
          </div>
        </div>
      ) : win.isWeekend ? (
        <button onClick={() => setView({ name: "form", date: today })} className="w-full bg-green-500 text-black rounded-3xl px-5 py-5 flex items-center gap-4 active:brightness-90 text-left">
          <div className="w-12 h-12 rounded-2xl bg-black text-green-500 flex items-center justify-center"><Camera size={24} /></div>
          <div className="flex-1">
            <p className="font-display text-2xl font-bold uppercase leading-none">Fazer check-in</p>
            <p className="text-[13px] mt-1 opacity-80">fotos de frente, lado e costas + medidas</p>
          </div>
          <ChevronRight size={22} />
        </button>
      ) : (
        <div className="bg-zinc-900 border border-zinc-800 rounded-3xl px-5 py-4 flex items-center gap-3">
          <div className="w-10 h-10 rounded-full bg-black border border-zinc-800 flex items-center justify-center text-zinc-500"><CalendarCheck size={18} /></div>
          <div>
            <p className="text-[15px] font-semibold">Próximo check-in</p>
            <p className="text-[12px] text-zinc-500">{fmtWeekdayLong(win.nextSat)} ou domingo</p>
          </div>
        </div>
      )}

      {/* linha do tempo */}
      {allDates.length === 0 ? (
        <p className="text-center text-[13px] text-zinc-500 font-mono py-10">nenhum check-in ainda</p>
      ) : (
        <div className="relative">
          {allDates.map((d, idx) => {
            const ph = photosOf(d);
            const ev = evolutionLog[d] || {};
            return (
              <div key={d} className="relative pl-6 pb-5">
                <div className="absolute left-[5px] top-2 bottom-0 w-[2px] bg-zinc-800" style={{ display: idx === allDates.length - 1 ? "none" : "block" }} />
                <div className="absolute left-0 top-[7px] w-3 h-3 rounded-full bg-[#F4F1E8]" />
                <button onClick={() => setView({ name: "detail", date: d })} className="w-full text-left">
                  <div className="flex items-center justify-between mb-2.5">
                    <p className="text-[17px] font-semibold">{fmtWeekdayLong(d)}</p>
                    <ChevronRight size={18} className="text-zinc-500" />
                  </div>
                  <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-4">
                    <div className="grid grid-cols-3 gap-2.5">
                      {POSES.map((p) => (
                        <div key={p.id} className="aspect-[3/4] rounded-2xl overflow-hidden bg-black">
                          {ph[p.id] && <img src={ph[p.id]} alt={p.label} className="w-full h-full object-cover" loading="lazy" />}
                        </div>
                      ))}
                    </div>
                    <div className="mt-3 grid grid-cols-3 gap-2.5">
                      {MEASURES.map((m) => (
                        <div key={m.key} className="min-w-0">
                          <p className="text-[12px] text-zinc-500 truncate">{m.label}</p>
                          <p className="font-mono text-[17px] font-semibold">{fmtNum(ev[m.key])}<span className="text-[12px] text-zinc-400 font-normal"> {m.unit}</span></p>
                        </div>
                      ))}
                    </div>
                  </div>
                </button>
              </div>
            );
          })}
        </div>
      )}

      {/* comparar */}
      {allDates.length > 1 && compareA && compareB && (
        <div>
          <p className="text-[17px] font-semibold mb-3">Comparar</p>
          <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-4">
            <div className="flex gap-1 bg-black rounded-xl p-1 mb-3">
              {POSES.map((p) => (
                <button key={p.id} onClick={() => setComparePose(p.id)} className={`flex-1 py-2 rounded-lg text-[13px] ${comparePose === p.id ? "bg-zinc-800 text-white" : "text-zinc-500"}`}>{p.label}</button>
              ))}
            </div>
            <div className="grid grid-cols-2 gap-2.5">
              {[[compareA, setCompareA], [compareB, setCompareB]].map(([val, setVal], i) => {
                const ph = photosOf(val);
                const src = ph[comparePose] || (!checkins[val] ? ph.front : null);
                return (
                  <div key={i}>
                    <div className="aspect-[3/4] rounded-2xl overflow-hidden bg-black flex items-center justify-center">
                      {src ? <img src={src} alt={val} className="w-full h-full object-cover" /> : <span className="font-mono text-[11px] text-zinc-600">sem foto</span>}
                    </div>
                    <select value={val} onChange={(e) => setVal(e.target.value)} className="mt-2 w-full bg-black border border-zinc-800 rounded-lg px-2 py-2 text-[12px] font-mono" style={{ colorScheme: "dark" }}>
                      {allDates.map((d) => <option key={d} value={d}>{fmtLong(d)}</option>)}
                    </select>
                    <p className="font-mono text-[11px] text-zinc-500 mt-1 text-center">{fmtNum(evolutionLog[val]?.weight)} kg · {fmtNum(evolutionLog[val]?.bodyFat)}% · {fmtNum(evolutionLog[val]?.waist)} cm</p>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Profile modal ----------
function ProfileModal({ profile, onSave, onClose, onSignOut, email }) {
  const [form, setForm] = useState(profile);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const refWeight = toNum(form.refWeight) || 0;
  const kcal = toNum(form.kcal) || 0;
  const proteinG = Math.round((toNum(form.proteinPerKg) || 0) * refWeight);
  const fatG = Math.round((toNum(form.fatPerKg) || 0) * refWeight);
  const carbsG = Math.max(0, Math.round((kcal - proteinG * 4 - fatG * 9) / 4));

  const tdee = calcTdee(form);
  const suggestedKcal = tdee ? tdee + (GOAL_ADJUSTMENTS[form.goal] || 0) : null;

  return (
    <Modal onClose={onClose} title="Perfil e metas">
      <div className="flex flex-col gap-3">
        {email && (
          <div className="flex items-center justify-between gap-2 bg-black border border-zinc-800 rounded-lg px-3 py-2">
            <span className="font-mono text-[12px] text-zinc-400 truncate">conta: <span className="text-white">{email}</span></span>
            {onSignOut && <button onClick={() => { if (confirm("Sair da conta?")) onSignOut(); }} className="font-mono text-[11px] text-red-400 flex-shrink-0">sair</button>}
          </div>
        )}

        <div className="grid grid-cols-3 gap-3">
          <Field label="Nome" value={form.name} onChange={set("name")} placeholder="Seu nome" />
          <Field label="Idade" value={form.age} onChange={set("age")} type="number" />
          <label className="flex flex-col gap-1">
            <span className="text-[11px] font-mono uppercase tracking-wider text-zinc-500">Sexo</span>
            <select value={form.sex} onChange={set("sex")} className="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-[14px] focus:outline-none focus:border-green-500">
              <option value="masculino">Masc.</option>
              <option value="feminino">Fem.</option>
            </select>
          </label>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <label className="flex flex-col gap-1">
            <span className="text-[11px] font-mono uppercase tracking-wider text-zinc-500">Objetivo</span>
            <select value={form.goal} onChange={set("goal")} className="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-[14px] focus:outline-none focus:border-green-500">
              <option value="perda">Perda de peso</option>
              <option value="manutencao">Manutenção</option>
              <option value="ganho">Ganho de massa</option>
            </select>
          </label>
          <label className="flex flex-col gap-1">
            <span className="text-[11px] font-mono uppercase tracking-wider text-zinc-500">Atividade</span>
            <select value={form.activityLevel} onChange={set("activityLevel")} className="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-[14px] focus:outline-none focus:border-green-500">
              <option value="sedentario">Sedentário</option>
              <option value="leve">Leve</option>
              <option value="moderado">Moderado</option>
              <option value="intenso">Intenso</option>
              <option value="muito_intenso">Muito intenso</option>
            </select>
          </label>
        </div>
        <Field label="Altura (cm)" value={form.heightCm} onChange={set("heightCm")} type="number" />
        <Field label="Peso de referência (kg)" value={form.refWeight} onChange={set("refWeight")} type="number" />

        <Field label="Meta de calorias diárias (kcal)" value={form.kcal} onChange={set("kcal")} type="number" />
        {suggestedKcal !== null && (
          <button
            onClick={() => setForm({ ...form, kcal: String(suggestedKcal) })}
            className="flex items-center justify-between bg-black border border-zinc-800 hover:border-green-500 rounded-lg px-3 py-2 text-left transition"
          >
            <span className="font-mono text-[11px] text-zinc-400">TDEE estimado (Mifflin-St Jeor): <span className="text-white">{tdee} kcal</span></span>
            <span className="font-mono text-[11px] text-green-500">usar {suggestedKcal} kcal →</span>
          </button>
        )}

        <div className="grid grid-cols-2 gap-3">
          <Field label="Proteína (g/kg)" value={form.proteinPerKg} onChange={set("proteinPerKg")} type="number" />
          <Field label="Gordura (g/kg)" value={form.fatPerKg} onChange={set("fatPerKg")} type="number" />
        </div>
        <div className="font-mono text-[11px] text-zinc-500 bg-black border border-zinc-800 rounded-lg px-3 py-2 flex flex-col gap-0.5">
          <span>proteína: {proteinG}g · gordura: {fatG}g</span>
          <span className="text-green-600">carboidrato (calculado do restante): {carbsG}g</span>
        </div>

        <Field label="Meta de água diária (ml)" value={form.waterGoalMl} onChange={set("waterGoalMl")} type="number" />
        <Field label="Meta de passos diária (opcional)" value={form.stepsGoal} onChange={set("stepsGoal")} type="number" placeholder="ex: 8000" />
        <Field label="Meta de treinos por semana" value={form.trainingDaysPerWeek} onChange={set("trainingDaysPerWeek")} type="number" placeholder="ex: 5" />

        <button onClick={() => onSave({ ...form, heightCm: toNum(form.heightCm) || 0, refWeight, kcal, proteinPerKg: toNum(form.proteinPerKg) || 0, fatPerKg: toNum(form.fatPerKg) || 0, waterGoalMl: toNum(form.waterGoalMl) || 0, stepsGoal: form.stepsGoal === "" ? "" : toNum(form.stepsGoal) || 0, trainingDaysPerWeek: toNum(form.trainingDaysPerWeek) || 5 })} className="mt-1 bg-green-500 text-black font-semibold rounded-lg py-2.5 text-[14px] hover:brightness-110 transition">Salvar perfil</button>
      </div>
    </Modal>
  );
}

// ---------- shared ----------
function Field({ label, value, onChange, type = "text", placeholder }) {
  const isNumeric = type === "number";
  return (
    <label className="flex flex-col gap-1">
      <span className="text-[11px] font-mono uppercase tracking-wider text-zinc-500">{label}</span>
      <input
        type={isNumeric ? "text" : type}
        inputMode={isNumeric ? "decimal" : undefined}
        value={value}
        onChange={onChange}
        placeholder={placeholder}
        className="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-[14px] focus:outline-none focus:border-green-500"
      />
    </label>
  );
}

function Modal({ title, children, onClose }) {
  return (
    <div className="fixed inset-0 bg-black flex items-end sm:items-center justify-center z-20 p-0 sm:p-4">
      <div className="bg-zinc-900 border border-zinc-700 rounded-t-2xl sm:rounded-2xl w-full sm:max-w-sm p-5 pb-8 sm:pb-5 max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display text-xl font-semibold">{title}</h3>
          <button onClick={onClose} className="text-zinc-500 hover:text-white"><X size={18} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}
